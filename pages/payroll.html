<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>NATRA - Slip Gaji Karyawan</title>
  <link rel="stylesheet" href="../src/styles/tailwind.css">
  <script src="../src/core/theme/theme-init.js"></script>
  <script src="../src/vendor/lucide.min.js"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 pb-24 min-h-screen">
  <div class="app-wrap max-w-lg mx-auto">
    
    <!-- Top Header -->
    <header class="module-header bg-white/80 dark:bg-slate-800/80 backdrop-blur-md border-b border-gray-100 dark:border-slate-700 sticky top-0 z-[100]">
      <div class="module-header-row flex items-center justify-between px-5 h-16">
        <div class="flex items-center gap-3">
          <button onclick="window.history.back()" class="w-10 h-10 rounded-full bg-slate-100 dark:bg-slate-700 flex items-center justify-center text-slate-600 dark:text-slate-200 active:scale-90 transition-transform flex-shrink-0">
            <i data-lucide="chevron-left" class="w-5 h-5"></i>
          </button>
          <h1 class="text-base font-extrabold text-slate-800 dark:text-white">Slip Gaji Bulanan</h1>
        </div>
        <div class="flex-shrink-0">
          <span id="payroll-period" class="text-[10px] font-extrabold text-primary-600 bg-primary-50 dark:bg-primary-900/30 px-3 py-1.5 rounded-full uppercase tracking-wider">
            Memuat...
          </span>
        </div>
      </div>
    </header>

    <main class="px-5 py-6 space-y-6">
      
      <!-- Hero Take Home Pay Card -->
      <div class="bg-white dark:bg-slate-800 rounded-[2rem] p-6 shadow-sm border border-slate-100 dark:border-slate-700 relative overflow-hidden">
        <div class="absolute -top-16 -right-16 w-36 h-36 bg-primary-500/10 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-16 -left-16 w-36 h-36 bg-blue-500/10 rounded-full blur-3xl pointer-events-none"></div>
        
        <div class="relative z-10 flex flex-col items-center text-center">
          <p class="text-[10px] font-extrabold text-slate-400 dark:text-slate-500 uppercase tracking-[0.2em] mb-1.5">Gaji Bersih Diterima</p>
          <div class="flex items-baseline gap-1 my-1">
            <span class="text-lg font-bold text-slate-400">Rp</span>
            <h2 id="thp-amount" class="text-4xl sm:text-5xl font-extrabold text-slate-900 dark:text-white tracking-tight">0</h2>
          </div>
          
          <!-- Employee Details Box Inside Hero -->
          <div class="mt-5 w-full flex items-center justify-between p-3.5 bg-slate-50 dark:bg-slate-700/40 rounded-2xl border border-slate-100 dark:border-slate-700/60">
            <div class="flex items-center gap-3 min-w-0">
              <div class="w-10 h-10 rounded-xl bg-primary-50 dark:bg-primary-900/30 text-primary-600 dark:text-primary-400 flex items-center justify-center flex-shrink-0">
                <i data-lucide="user-check" class="w-5 h-5"></i>
              </div>
              <div class="min-w-0 text-left">
                <p id="emp-name-pos" class="text-xs font-extrabold text-slate-800 dark:text-slate-200 truncate leading-tight">Agus Darsono</p>
                <p id="emp-id-num" class="text-[10px] font-semibold text-slate-400 mt-0.5 truncate">EMP001 • Driver / Pengemudi</p>
              </div>
            </div>
            <div id="payroll-status-badge" class="px-2.5 py-1 bg-amber-50 dark:bg-amber-900/30 text-amber-600 dark:text-amber-400 rounded-lg text-[9px] font-extrabold uppercase tracking-wider flex-shrink-0">
              DRAFT
            </div>
          </div>
        </div>
      </div>

      <!-- Rincian Pendapatan (Earnings) -->
      <section class="space-y-3">
        <div class="flex items-center justify-between px-1">
          <div class="flex items-center gap-2">
            <div class="w-2 h-2 rounded-full bg-emerald-500"></div>
            <h3 class="text-[11px] font-extrabold text-slate-400 uppercase tracking-widest">Rincian Pendapatan</h3>
          </div>
        </div>

        <div id="earnings-container" class="bg-white dark:bg-slate-800 rounded-[1.75rem] overflow-hidden shadow-sm border border-slate-100 dark:border-slate-700 divide-y divide-slate-100 dark:divide-slate-700/50">
          <div class="p-6 text-center text-slate-400 text-xs font-medium">Memuat rincian pendapatan...</div>
        </div>
      </section>

      <!-- Rincian Potongan (Deductions) -->
      <section class="space-y-3">
        <div class="flex items-center justify-between px-1">
          <div class="flex items-center gap-2">
            <div class="w-2 h-2 rounded-full bg-red-500"></div>
            <h3 class="text-[11px] font-extrabold text-slate-400 uppercase tracking-widest">Rincian Potongan</h3>
          </div>
        </div>

        <div id="deductions-container" class="bg-white dark:bg-slate-800 rounded-[1.75rem] overflow-hidden shadow-sm border border-slate-100 dark:border-slate-700 divide-y divide-slate-100 dark:divide-slate-700/50">
          <div class="p-6 text-center text-slate-400 text-xs font-medium">Memuat rincian potongan...</div>
        </div>
      </section>

      <!-- Download Button Section (Spacious & Responsive) -->
      <div class="pt-3 pb-8 space-y-3">
        <button id="btn-download-slip" class="w-full h-14 bg-primary-600 hover:bg-primary-700 text-white rounded-2xl flex items-center justify-center gap-3 font-extrabold text-sm shadow-lg shadow-primary-500/20 active:scale-[0.98] transition-all">
          <i data-lucide="download" class="w-5 h-5"></i>
          <span>Unduh Slip Gaji (PDF)</span>
        </button>
        
        <div class="flex items-center justify-center gap-1.5 text-slate-400 text-[10px] font-bold uppercase tracking-wider">
          <i data-lucide="shield-check" class="w-4 h-4 text-emerald-500"></i>
          <span>Tervalidasi Resmi NATRA Enterprise HRIS</span>
        </div>
      </div>

    </main>
  </div>

  <script type="module" src="../src/features/payroll/payroll.controller.js"></script>
  <script>if (typeof lucide !== "undefined") lucide.createIcons();</script>
</body>
</html>
