<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>NATRA - Lembur & Overtime</title>
  <link rel="stylesheet" href="../src/styles/tailwind.css">
  <script src="../src/core/theme/theme-init.js"></script>
  <script src="../src/vendor/lucide.min.js"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 pb-20 min-h-screen">
  <div class="app-wrap max-w-lg mx-auto">
    
    <!-- Top Header -->
    <header class="module-header bg-white/80 dark:bg-slate-800/80 backdrop-blur-md border-b border-gray-100 dark:border-slate-700 sticky top-0 z-[100]">
      <div class="module-header-row flex items-center justify-between px-5 h-16">
        <div class="flex items-center gap-3">
          <button onclick="window.history.back()" class="w-10 h-10 rounded-full bg-slate-100 dark:bg-slate-700 flex items-center justify-center text-slate-600 dark:text-slate-200 active:scale-90 transition-transform flex-shrink-0">
            <i data-lucide="chevron-left" class="w-5 h-5"></i>
          </button>
          <h1 class="text-base font-extrabold text-slate-800 dark:text-white">Lembur & Overtime</h1>
        </div>
        <div class="flex items-center gap-1.5 px-3 py-1 bg-primary-50 dark:bg-primary-900/30 text-primary-600 dark:text-primary-400 rounded-full text-[10px] font-extrabold uppercase tracking-wider">
          <i data-lucide="timer" class="w-3.5 h-3.5"></i>
          <span>Pengajuan</span>
        </div>
      </div>
    </header>

    <main class="px-5 py-6 space-y-6">
      
      <!-- Overtime Stats Card -->
      <div class="bg-slate-900 dark:bg-slate-800 text-white p-6 rounded-[2rem] shadow-xl relative overflow-hidden">
        <div class="absolute -top-12 -right-12 w-36 h-36 bg-primary-500/20 rounded-full blur-2xl pointer-events-none"></div>
        <div class="absolute -bottom-12 -left-12 w-36 h-36 bg-blue-500/10 rounded-full blur-2xl pointer-events-none"></div>
        
        <div class="relative z-10 flex justify-between items-center">
          <div>
            <p class="text-primary-300 text-[10px] font-extrabold uppercase tracking-[0.2em] mb-1">Total Jam Lembur Disetujui</p>
            <div class="flex items-baseline gap-1.5">
              <h2 id="total-overtime-hours" class="text-4xl font-extrabold tracking-tight">0</h2>
              <span class="text-xs font-bold text-primary-300">Jam</span>
            </div>
            <p class="mt-3 text-[11px] font-medium text-slate-300">
              Estimasi Insentif: <span id="total-overtime-pay" class="text-emerald-400 font-extrabold">Rp 0</span>
            </p>
          </div>
          <div class="w-14 h-14 rounded-2xl bg-white/10 backdrop-blur-md flex items-center justify-center border border-white/10 text-primary-300 flex-shrink-0">
            <i data-lucide="timer" class="w-7 h-7"></i>
          </div>
        </div>
      </div>

      <!-- Overtime Submission Form -->
      <section class="space-y-3">
        <div class="flex items-center justify-between px-1">
          <div class="flex items-center gap-2">
            <div class="w-2 h-2 rounded-full bg-primary-500"></div>
            <h3 class="text-[11px] font-extrabold text-slate-400 uppercase tracking-widest">Formulir Pengajuan Lembur</h3>
          </div>
          <span class="text-[9px] font-bold text-amber-600 bg-amber-50 dark:bg-amber-900/30 px-2 py-0.5 rounded">Maks 1x / Hari</span>
        </div>

        <div class="bg-white dark:bg-slate-800 rounded-[2rem] p-6 shadow-sm border border-slate-100 dark:border-slate-700 space-y-4">
          
          <!-- Tanggal Lembur -->
          <div class="space-y-1.5">
            <label class="text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider ml-1">Tanggal Lembur</label>
            <input type="date" id="overtime-date" class="w-full bg-slate-50 dark:bg-slate-700/50 border-none rounded-2xl px-4 py-3.5 text-sm font-bold text-slate-800 dark:text-white focus:ring-2 focus:ring-primary-500/20">
          </div>

          <!-- Jam Mulai & Selesai -->
          <div class="grid grid-cols-2 gap-3">
            <div class="space-y-1.5">
              <label class="text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider ml-1">Jam Mulai</label>
              <input type="time" id="overtime-start" class="w-full bg-slate-50 dark:bg-slate-700/50 border-none rounded-2xl px-4 py-3.5 text-sm font-bold text-slate-800 dark:text-white focus:ring-2 focus:ring-primary-500/20">
            </div>
            <div class="space-y-1.5">
              <label class="text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider ml-1">Jam Selesai</label>
              <input type="time" id="overtime-end" class="w-full bg-slate-50 dark:bg-slate-700/50 border-none rounded-2xl px-4 py-3.5 text-sm font-bold text-slate-800 dark:text-white focus:ring-2 focus:ring-primary-500/20">
            </div>
          </div>

          <!-- Estimasi Durasi Jam Preview -->
          <div id="duration-preview-box" class="p-3 bg-primary-50/50 dark:bg-primary-900/20 rounded-xl border border-primary-100/50 dark:border-primary-800/30 flex items-center justify-between">
            <span class="text-xs font-bold text-slate-600 dark:text-slate-300">Estimasi Durasi Lembur:</span>
            <span id="duration-preview-text" class="text-xs font-extrabold text-primary-600 dark:text-primary-400">0 Jam</span>
          </div>

          <!-- Alasan / Keterangan Lembur -->
          <div class="space-y-1.5">
            <label class="text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider ml-1">Alasan / Pekerjaan Lembur</label>
            <input type="text" id="overtime-reason" placeholder="Contoh: Pengantaran logistik & kiriman darurat" 
              class="w-full bg-slate-50 dark:bg-slate-700/50 border-none rounded-2xl px-4 py-3.5 text-sm font-bold text-slate-800 dark:text-white placeholder:text-slate-400 focus:ring-2 focus:ring-primary-500/20">
          </div>

          <!-- Tombol Ajukan -->
          <button id="btn-request-overtime" class="w-full h-14 bg-primary-600 hover:bg-primary-700 text-white rounded-2xl flex items-center justify-center gap-3 font-extrabold text-sm shadow-lg shadow-primary-500/20 active:scale-[0.98] transition-all mt-2">
            <i data-lucide="plus" class="w-5 h-5"></i>
            <span>Ajukan Lembur</span>
          </button>
        </div>
      </section>

      <!-- Riwayat Lembur -->
      <section class="space-y-3 pb-6">
        <div class="flex items-center justify-between px-1">
          <div class="flex items-center gap-2">
            <div class="w-2 h-2 rounded-full bg-slate-400"></div>
            <h3 class="text-[11px] font-extrabold text-slate-400 uppercase tracking-widest">Riwayat Lembur Saya</h3>
          </div>
        </div>

        <div id="overtime-history-container" class="space-y-3">
          <div class="p-6 bg-white dark:bg-slate-800 rounded-2xl text-center text-slate-400 text-xs font-medium border border-slate-100 dark:border-slate-700">
            Memuat riwayat pengajuan lembur...
          </div>
        </div>
      </section>

    </main>
  </div>

  <script type="module" src="../src/features/overtime/overtime.controller.js"></script>
  <script>if (typeof lucide !== "undefined") lucide.createIcons();</script>
</body>
</html>
