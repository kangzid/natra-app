<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>NATRA - Detail Tugas</title>
  <link rel="stylesheet" href="../src/styles/tailwind.css">
  <script src="../src/core/theme/theme-init.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100/70 dark:bg-slate-950 pb-24 ">
  <div class="app-wrap max-w-md mx-auto min-h-screen">
    
    <!-- Top Header (iOS Glassmorphism) -->
    <header class="module-header bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200/60 dark:border-slate-800 sticky top-0 z-[100]">
      <div class="module-header-row flex items-center justify-between px-5 h-16">
        <button id="back-btn" class="w-10 h-10 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-600 dark:text-slate-300 active:scale-90 transition-transform">
          <i data-lucide="chevron-left" class="w-6 h-6"></i>
        </button>
        <h1 class="text-base font-bold text-slate-800 dark:text-white tracking-tight">Detail Penugasan</h1>
        <button id="task-refresh-btn" class="w-10 h-10 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-600 dark:text-slate-300 active:scale-90 transition-transform">
          <i data-lucide="rotate-cw" class="w-4 h-4"></i>
        </button>
      </div>
    </header>

    <main class="px-5 py-5 space-y-4">
      
      <!-- Skeleton Loading -->
      <div id="task-loading" class="space-y-4">
        <div class="bg-white dark:bg-slate-900 rounded-[2rem] p-6 shadow-sm border border-slate-200/60 dark:border-slate-800 animate-pulse space-y-4">
          <div class="flex gap-2">
             <div class="h-6 w-24 bg-slate-200 dark:bg-slate-700 rounded-full"></div>
             <div class="h-6 w-20 bg-slate-200 dark:bg-slate-700 rounded-full"></div>
          </div>
          <div class="h-6 w-3/4 bg-slate-200 dark:bg-slate-700 rounded-xl"></div>
          <div class="h-20 bg-slate-100 dark:bg-slate-800 rounded-2xl"></div>
          <div class="h-28 bg-slate-100 dark:bg-slate-800 rounded-2xl"></div>
        </div>
      </div>

      <!-- Main Task Detail Content -->
      <div id="task-content" class="hidden fade-in space-y-4">
        
        <!-- iOS Status Stepper Card -->
        <div id="task-roadmap-card" class="bg-white dark:bg-slate-900 rounded-[2rem] p-5 shadow-xs border border-slate-200/70 dark:border-slate-800 space-y-4">
          <div class="flex items-center justify-between">
            <span class="text-[11px] font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500">
              Status Tugas
            </span>
            <span id="roadmap-status-badge" class="px-3 py-1 rounded-full text-xs font-bold bg-primary-50 dark:bg-primary-950/60 text-primary-600 dark:text-primary-400 border border-primary-100 dark:border-primary-900">
              Menunggu Konfirmasi
            </span>
          </div>

          <!-- Minimalist 3-Step Stepper -->
          <div class="relative pt-1 pb-1">
            <!-- Connecting Progress Line -->
            <div class="absolute top-[18px] left-[15%] right-[15%] h-1 bg-slate-100 dark:bg-slate-800 -z-0">
              <div id="roadmap-progress-bar" class="h-full bg-primary-500 rounded-full transition-all duration-500 w-0"></div>
            </div>

            <!-- Stepper Nodes -->
            <div class="grid grid-cols-3 gap-2 relative z-10 text-center">
              
              <!-- Step 1: Terima -->
              <div class="flex flex-col items-center gap-1" id="step-node-1">
                <div class="step-icon-wrap w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold transition-all bg-slate-100 dark:bg-slate-800 text-slate-400">
                  <i data-lucide="check" class="w-4 h-4"></i>
                </div>
                <p class="text-[11px] font-bold text-slate-700 dark:text-slate-300">1. Terima</p>
              </div>

              <!-- Step 2: Berjalan -->
              <div class="flex flex-col items-center gap-1" id="step-node-2">
                <div class="step-icon-wrap w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold transition-all bg-slate-100 dark:bg-slate-800 text-slate-400">
                  <i data-lucide="navigation" class="w-3.5 h-3.5"></i>
                </div>
                <p class="text-[11px] font-bold text-slate-700 dark:text-slate-300">2. Berjalan</p>
              </div>

              <!-- Step 3: Selesai -->
              <div class="flex flex-col items-center gap-1" id="step-node-3">
                <div class="step-icon-wrap w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold transition-all bg-slate-100 dark:bg-slate-800 text-slate-400">
                  <i data-lucide="flag" class="w-3.5 h-3.5"></i>
                </div>
                <p class="text-[11px] font-bold text-slate-700 dark:text-slate-300">3. Selesai</p>
              </div>

            </div>
          </div>
        </div>

        <!-- Task Core Information Card -->
        <div class="bg-white dark:bg-slate-900 rounded-[2rem] p-5 shadow-xs border border-slate-200/70 dark:border-slate-800 space-y-4">
          <div class="flex items-center justify-between gap-2">
            <div id="task-type-badge-wrap"></div>
            <div id="task-priority"></div>
          </div>

          <h2 class="text-xl font-black text-slate-900 dark:text-white tracking-tight leading-snug" id="task-title">
            Memuat judul tugas...
          </h2>
          
          <div class="bg-slate-50 dark:bg-slate-800/50 rounded-2xl p-4 border border-slate-100 dark:border-slate-800 space-y-1">
            <h3 class="text-[10px] font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
              <i data-lucide="align-left" class="w-3.5 h-3.5 text-primary-500"></i> Deskripsi & Instruksi
            </h3>
            <p class="text-xs text-slate-600 dark:text-slate-300 leading-relaxed whitespace-pre-line font-medium" id="task-description">
              Memuat deskripsi...
            </p>
          </div>

          <!-- Dynamic Dispatch & Interactive Maps -->
          <div id="task-dispatch-container"></div>

          <!-- Due Date & Status Footer -->
          <div class="flex items-center justify-between bg-slate-50 dark:bg-slate-800/50 p-3.5 rounded-2xl border border-slate-100 dark:border-slate-800 text-xs">
             <div class="flex items-center gap-2.5">
               <div class="w-8 h-8 rounded-xl bg-amber-500/10 text-amber-600 flex items-center justify-center">
                 <i data-lucide="clock" class="w-4 h-4"></i>
               </div>
               <div>
                 <p class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Tenggat Waktu</p>
                 <p class="text-xs font-bold text-slate-800 dark:text-slate-200" id="task-due">--/--/----</p>
               </div>
             </div>
             <div id="task-status"></div>
          </div>
        </div>

        <!-- Completion Notes (If finished) -->
        <div id="completion-section" class="hidden bg-emerald-50 dark:bg-emerald-950/30 rounded-[2rem] p-5 border border-emerald-100 dark:border-emerald-900/50 space-y-1.5">
          <h3 class="text-xs font-black text-emerald-600 dark:text-emerald-400 uppercase tracking-wider flex items-center gap-1.5">
            <i data-lucide="check-circle" class="w-4 h-4"></i> Catatan Penyelesaian
          </h3>
          <p class="text-xs text-slate-700 dark:text-slate-300 italic" id="completion-notes"></p>
        </div>

        <!-- Action Button Area (Updates In-Place without page kickout) -->
        <div id="task-action" class="pt-1">
           <!-- Action Buttons injected here -->
        </div>

      </div>
    </main>
  </div>

  <script type="module" src="../src/features/tasks/task-detail.controller.js"></script>
</body>
</html>
