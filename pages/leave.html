<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>NATRA - Pengajuan Cuti & Izin</title>
  <link rel="stylesheet" href="../src/styles/tailwind.css">
  <script src="../src/core/theme/theme-init.js"></script>
  <script src="../src/vendor/lucide.min.js"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 pb-20 min-h-screen">
  <div class="app-wrap max-w-lg mx-auto">
    
    <!-- Top Header -->
    <header class="module-header bg-white/80 dark:bg-slate-800/80 backdrop-blur-md border-b border-gray-100 dark:border-slate-700 sticky top-0 z-[100]">
      <div class="module-header-row flex items-center justify-between px-5 h-16">
        <div class="flex items-center gap-3">
          <button onclick="window.history.back()" class="w-10 h-10 rounded-full bg-slate-100 dark:bg-slate-700 flex items-center justify-center text-slate-600 dark:text-slate-200 active:scale-90 transition-transform flex-shrink-0">
            <i data-lucide="chevron-left" class="w-5 h-5"></i>
          </button>
          <h1 class="text-base font-extrabold text-slate-800 dark:text-white">Pengajuan Cuti & Izin</h1>
        </div>
        <div class="flex items-center gap-1.5 px-3 py-1 bg-emerald-50 dark:bg-emerald-900/30 text-emerald-600 dark:text-emerald-400 rounded-full text-[10px] font-extrabold uppercase tracking-wider">
          <i data-lucide="calendar-check" class="w-3.5 h-3.5"></i>
          <span>Kehadiran</span>
        </div>
      </div>
    </header>

    <main class="px-5 py-6 space-y-6">
      
      <!-- Metrics Grid: Kuota & Sisa Cuti -->
      <div class="grid grid-cols-3 gap-2.5">
        <!-- Card 1: Sisa Cuti -->
        <div class="bg-primary-600 dark:bg-primary-700 text-white p-4 rounded-2xl shadow-lg shadow-primary-600/20 flex flex-col justify-between">
          <div class="w-7 h-7 rounded-xl bg-white/20 flex items-center justify-center mb-2">
            <i data-lucide="calendar" class="w-4 h-4"></i>
          </div>
          <div>
            <h3 id="stat-remaining-leave" class="text-xl font-black tracking-tight">12</h3>
            <p class="text-primary-100 text-[9px] font-bold uppercase tracking-wider mt-0.5">Sisa Cuti</p>
          </div>
        </div>

        <!-- Card 2: Terpakai -->
        <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 flex flex-col justify-between">
          <div class="w-7 h-7 rounded-xl bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 flex items-center justify-center mb-2">
            <i data-lucide="check-circle" class="w-4 h-4 text-emerald-500"></i>
          </div>
          <div>
            <h3 id="stat-used-leave" class="text-xl font-black text-slate-800 dark:text-white tracking-tight">0</h3>
            <p class="text-slate-400 text-[9px] font-bold uppercase tracking-wider mt-0.5">Terpakai</p>
          </div>
        </div>

        <!-- Card 3: Menunggu -->
        <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 flex flex-col justify-between">
          <div class="w-7 h-7 rounded-xl bg-amber-50 dark:bg-amber-900/30 text-amber-600 dark:text-amber-400 flex items-center justify-center mb-2">
            <i data-lucide="clock" class="w-4 h-4"></i>
          </div>
          <div>
            <h3 id="stat-pending-leave" class="text-xl font-black text-slate-800 dark:text-white tracking-tight">0</h3>
            <p class="text-slate-400 text-[9px] font-bold uppercase tracking-wider mt-0.5">Menunggu</p>
          </div>
        </div>
      </div>

      <!-- Form Pengajuan -->
      <section class="space-y-3">
        <div class="flex items-center justify-between px-1">
          <div class="flex items-center gap-2">
            <div class="w-2 h-2 rounded-full bg-primary-500"></div>
            <h3 class="text-[11px] font-extrabold text-slate-400 uppercase tracking-widest">Formulir Pengajuan</h3>
          </div>
        </div>

        <div class="bg-white dark:bg-slate-800 rounded-[2rem] p-6 shadow-sm border border-slate-100 dark:border-slate-700 space-y-4">
          
          <!-- Category Selector Buttons -->
          <div class="space-y-1.5">
            <label class="text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider ml-1">Kategori Pengajuan</label>
            <div class="grid grid-cols-3 gap-2">
              <button type="button" data-type="cuti" class="req-type-btn py-2.5 px-3 rounded-xl text-xs font-extrabold flex flex-col items-center gap-1.5 border transition-all bg-primary-50 border-primary-500 text-primary-600 dark:bg-primary-950/40 dark:border-primary-500 dark:text-primary-400">
                <i data-lucide="sun" class="w-4 h-4"></i>
                <span>Cuti</span>
              </button>
              <button type="button" data-type="izin_sakit" class="req-type-btn py-2.5 px-3 rounded-xl text-xs font-extrabold flex flex-col items-center gap-1.5 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 transition-all hover:bg-slate-50 dark:hover:bg-slate-700/50">
                <i data-lucide="heart-pulse" class="w-4 h-4 text-rose-500"></i>
                <span>Izin Sakit</span>
              </button>
              <button type="button" data-type="izin_absen" class="req-type-btn py-2.5 px-3 rounded-xl text-xs font-extrabold flex flex-col items-center gap-1.5 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 transition-all hover:bg-slate-50 dark:hover:bg-slate-700/50">
                <i data-lucide="calendar-x" class="w-4 h-4 text-amber-500"></i>
                <span>Izin Absen</span>
              </button>
            </div>
          </div>

          <!-- Specific Leave Type Sub-Dropdown (when Cuti selected) -->
          <div id="leave-type-wrapper" class="space-y-1.5">
            <div class="flex items-center justify-between ml-1">
              <label class="text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Jenis Cuti</label>
              <span id="leave-type-info" class="text-[9px] font-bold text-primary-600 dark:text-primary-400">Hak Cuti Reguler</span>
            </div>
            <div class="relative">
              <select id="leave-type-select" class="w-full bg-slate-50 dark:bg-slate-700/50 border-none rounded-2xl px-4 py-3.5 text-sm font-bold text-slate-800 dark:text-white appearance-none focus:ring-2 focus:ring-primary-500/20">
                <option value="">Memuat jenis cuti...</option>
              </select>
              <i data-lucide="chevron-down" class="absolute right-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400 pointer-events-none"></i>
            </div>
          </div>

          <!-- Dates: Mulai & Selesai with Live Duration Calculation -->
          <div class="grid grid-cols-2 gap-3">
            <div class="space-y-1.5">
              <label class="text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider ml-1">Tanggal Mulai</label>
              <input type="date" id="req-start-date" class="w-full bg-slate-50 dark:bg-slate-700/50 border-none rounded-2xl px-4 py-3.5 text-xs font-bold text-slate-800 dark:text-white focus:ring-2 focus:ring-primary-500/20">
            </div>
            <div class="space-y-1.5">
              <label class="text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider ml-1">Tanggal Selesai</label>
              <input type="date" id="req-end-date" class="w-full bg-slate-50 dark:bg-slate-700/50 border-none rounded-2xl px-4 py-3.5 text-xs font-bold text-slate-800 dark:text-white focus:ring-2 focus:ring-primary-500/20">
            </div>
          </div>

          <!-- Live Duration Display -->
          <div class="p-3 bg-blue-50/60 dark:bg-blue-950/30 rounded-xl border border-blue-100 dark:border-blue-900/50 flex items-center justify-between">
            <div class="flex items-center gap-2 text-xs font-bold text-blue-700 dark:text-blue-300">
              <i data-lucide="clock" class="w-4 h-4"></i>
              <span>Total Durasi:</span>
            </div>
            <span id="calculated-duration-badge" class="px-2.5 py-0.5 bg-blue-600 text-white rounded-lg text-xs font-black">1 Hari</span>
          </div>

          <!-- Alasan Pengajuan -->
          <div class="space-y-1.5">
            <label class="text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider ml-1">Alasan / Keperluan</label>
            <textarea id="req-reason" rows="3" placeholder="Tuliskan alasan pengajuan cuti atau izin..." 
              class="w-full bg-slate-50 dark:bg-slate-700/50 border-none rounded-2xl px-4 py-3.5 text-sm font-bold text-slate-800 dark:text-white placeholder:text-slate-400 focus:ring-2 focus:ring-primary-500/20 resize-none"></textarea>
          </div>

          <!-- Lampiran Surat Dokter / Bukti Pendukung -->
          <div class="space-y-1.5">
            <div class="flex items-center justify-between ml-1">
              <label id="attachment-label" class="text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">
                Lampiran / Surat Dokter <span class="text-slate-400 font-medium">(Opsional)</span>
              </label>
            </div>
            <input type="file" id="attachment-file-input" accept="image/*" class="hidden">
            
            <!-- Default Upload Trigger Box -->
            <div id="attachment-upload-trigger" role="button" class="w-full border-2 border-dashed border-slate-200 dark:border-slate-700 rounded-2xl p-4 flex flex-col items-center justify-center gap-1.5 bg-slate-50/50 dark:bg-slate-700/30 active:scale-[0.98] transition-all cursor-pointer hover:bg-slate-100/50">
              <div class="w-9 h-9 bg-white dark:bg-slate-800 rounded-xl flex items-center justify-center text-primary-600 shadow-sm">
                <i data-lucide="paperclip" class="w-4 h-4"></i>
              </div>
              <p class="text-xs font-bold text-slate-700 dark:text-slate-200 text-center">Pilih Foto atau Surat Keterangan</p>
              <p class="text-[10px] text-slate-400">JPG, PNG (Maks 10 MB)</p>
            </div>

            <!-- Preview Selected Image Box -->
            <div id="attachment-preview-container" class="hidden w-full p-3 bg-slate-50 dark:bg-slate-700/50 rounded-2xl border border-slate-200 dark:border-slate-700 items-center justify-between">
              <div class="flex items-center gap-3 min-w-0">
                <img id="attachment-preview-img" src="" class="w-12 h-12 rounded-xl object-cover border border-slate-200 flex-shrink-0 bg-white" alt="Preview Lampiran">
                <div class="min-w-0">
                  <p id="attachment-file-name" class="text-xs font-extrabold text-slate-800 dark:text-slate-200 truncate">surat_dokter.jpg</p>
                  <p id="attachment-file-size" class="text-[10px] text-slate-400 font-medium">150 KB</p>
                </div>
              </div>
              <button type="button" id="btn-remove-attachment" class="w-8 h-8 rounded-full bg-red-50 dark:bg-red-900/30 text-red-500 flex items-center justify-center flex-shrink-0 hover:bg-red-100 active:scale-90">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            </div>
          </div>

          <!-- Submit Button -->
          <button id="btn-submit-request" class="w-full h-14 bg-primary-600 hover:bg-primary-700 text-white rounded-2xl flex items-center justify-center gap-3 font-extrabold text-sm shadow-lg shadow-primary-500/20 active:scale-[0.98] transition-all mt-2">
            <i data-lucide="send" class="w-5 h-5"></i>
            <span>Kirim Pengajuan Cuti / Izin</span>
          </button>
        </div>
      </section>

      <!-- Riwayat Pengajuan Cuti & Izin -->
      <section class="space-y-3 pb-6">
        <div class="flex items-center justify-between px-1">
          <div class="flex items-center gap-2">
            <div class="w-2 h-2 rounded-full bg-slate-400"></div>
            <h3 class="text-[11px] font-extrabold text-slate-400 uppercase tracking-widest">Riwayat Pengajuan Saya</h3>
          </div>
        </div>

        <!-- Filter Tab Pill -->
        <div class="flex items-center gap-2 overflow-x-auto pb-1 no-scrollbar">
          <button type="button" data-filter="all" class="history-filter-btn px-3 py-1.5 rounded-full text-[11px] font-extrabold bg-slate-800 text-white dark:bg-white dark:text-slate-900 whitespace-nowrap">
            Semua
          </button>
          <button type="button" data-filter="cuti" class="history-filter-btn px-3 py-1.5 rounded-full text-[11px] font-extrabold bg-white dark:bg-slate-800 text-slate-500 dark:text-slate-400 border border-slate-200 dark:border-slate-700 whitespace-nowrap">
            Cuti
          </button>
          <button type="button" data-filter="izin_sakit" class="history-filter-btn px-3 py-1.5 rounded-full text-[11px] font-extrabold bg-white dark:bg-slate-800 text-slate-500 dark:text-slate-400 border border-slate-200 dark:border-slate-700 whitespace-nowrap">
            Izin Sakit
          </button>
          <button type="button" data-filter="izin_absen" class="history-filter-btn px-3 py-1.5 rounded-full text-[11px] font-extrabold bg-white dark:bg-slate-800 text-slate-500 dark:text-slate-400 border border-slate-200 dark:border-slate-700 whitespace-nowrap">
            Izin Absen
          </button>
        </div>

        <div id="leave-history-container" class="space-y-3">
          <div class="p-6 bg-white dark:bg-slate-800 rounded-2xl text-center text-slate-400 text-xs font-medium border border-slate-100 dark:border-slate-700">
            Memuat riwayat pengajuan...
          </div>
        </div>
      </section>

    </main>

    <!-- Modal Preview Lampiran / Surat Dokter -->
    <div id="attachment-modal" class="fixed inset-0 z-[200] bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4">
      <div class="bg-white dark:bg-slate-800 rounded-3xl max-w-sm w-full p-5 space-y-4 max-h-[90vh] overflow-y-auto">
        <div class="flex items-center justify-between">
          <h4 class="text-sm font-extrabold text-slate-800 dark:text-white">Lampiran / Surat Dokter</h4>
          <button id="btn-close-attachment-modal" class="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-700 flex items-center justify-center text-slate-500">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        </div>
        <div class="rounded-2xl overflow-hidden border border-slate-100 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 flex items-center justify-center min-h-[200px]">
          <img id="modal-attachment-img" src="" class="max-h-[60vh] w-full object-contain" alt="Surat Dokter">
        </div>
        <p id="modal-attachment-title" class="text-xs text-center font-bold text-slate-500 dark:text-slate-400"></p>
      </div>
    </div>

  </div>

  <script type="module" src="../src/features/leave/leave.controller.js"></script>
  <script>if (typeof lucide !== "undefined") lucide.createIcons();</script>
</body>
</html>
